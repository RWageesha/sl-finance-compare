name: Scrape Bank Rates

on:
  schedule:
    # 03:45, 09:45, 15:45, 21:45 UTC == 9:15am, 3:15pm, 9:15pm, 3:15am
    # Sri Lanka time (UTC+5:30, no DST, so this offset is fixed year-round)
    # — four scrapes a day, six hours apart.
    - cron: "45 3,9,15,21 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        working-directory: scraper
        run: python main.py
