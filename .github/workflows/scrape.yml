name: Scrape Fixed Deposit Rates

on:
  schedule:
    # 00:30 and 12:30 UTC ~= 06:00 and 18:00 Sri Lanka time (UTC+5:30)
    - cron: "30 0,12 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: go run ./cmd/scraper
