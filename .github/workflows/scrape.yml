name: Scrape Bank Rates

on:
  # No schedule here anymore — ComBank and BOC's WAFs 403 every request
  # from GitHub's hosted-runner IP ranges (confirmed; HNB/NDB alone always
  # succeeded from here). The real 4x/day automated scrape now runs from
  # a Render Cron Job instead, whose IP isn't blocked. This workflow stays
  # as a manual-only fallback (Actions tab -> Run workflow) — useful for
  # getting HNB/NDB data specifically, or for testing scraper changes,
  # without needing a Render deploy first.
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        working-directory: scraper
        run: python main.py
