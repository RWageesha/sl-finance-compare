name: Scrape Bank Rates

on:
  schedule:
    # Hourly, on the hour — temporarily bumped up from twice a day so it's
    # easy to watch a few real runs land in a short window. Once you've
    # confirmed it's working, dial this back (e.g. to the previous
    # "30 0,12 * * *" for 06:00/18:00 Sri Lanka time) — the bank sites
    # don't publish new rates every hour, so hourly is only useful for
    # this verification period, not as the steady-state schedule.
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        working-directory: scraper
        run: python main.py
