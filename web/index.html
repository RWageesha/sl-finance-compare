<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SL Finance Compare</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f7f7f8;
    --panel: #ffffff;
    --border: #e2e2e6;
    --text: #1c1c1f;
    --muted: #6b6b74;
    --accent: #2f6fed;
    --header-bg: #17181c;
    --header-text: #f2f2f4;
    --row-alt: #fafafb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214;
      --panel: #1b1c1f;
      --border: #303136;
      --text: #eceef0;
      --muted: #9a9aa2;
      --accent: #6c9bff;
      --header-bg: #0c0d0f;
      --header-text: #eceef0;
      --row-alt: #202126;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    background: var(--header-bg);
    color: var(--header-text);
    padding: 1.5rem 1.5rem 1.25rem;
  }
  header h1 {
    margin: 0 0 0.25rem;
    font-size: 1.4rem;
    font-weight: 600;
  }
  header p {
    margin: 0;
    color: #b6b7bf;
    font-size: 0.9rem;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 1.5rem;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    align-items: center;
    margin-bottom: 1rem;
  }
  .toolbar label {
    font-size: 0.85rem;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }
  select {
    font: inherit;
    padding: 0.4rem 0.5rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
  }
  .status {
    margin-left: auto;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .table-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.92rem;
    min-width: 640px;
  }
  th, td {
    padding: 0.6rem 0.8rem;
    text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  th {
    cursor: pointer;
    user-select: none;
    color: var(--muted);
    font-weight: 600;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  th:hover { color: var(--text); }
  th.sorted::after { content: " " attr(data-arrow); }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  td.rate { font-weight: 600; text-align: right; }
  td.tenure { text-align: right; }
  .badge {
    display: inline-block;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    /* Fallback for any category code without a specific rule below, so a
       new taxonomy code never renders unstyled. */
    background: var(--border);
    color: var(--text);
  }
  /* Fixed deposit categories */
  .badge-standard_fd        { background: #e6f0ff; color: #1a4fb4; }
  .badge-senior_citizen_fd  { background: #fdeedd; color: #a35a10; }
  .badge-special_fd         { background: #ecebff; color: #4a3fd6; }
  .badge-sathkara_fd        { background: #fde8ef; color: #b3245c; }
  .badge-digital_fd         { background: #e4f8ef; color: #157a4d; }
  /* Savings categories */
  .badge-standard_savings   { background: #e0f7fa; color: #00707a; }
  .badge-senior_savings     { background: #fff4d6; color: #8a6100; }
  .badge-teen_savings       { background: #e3f2fd; color: #0d5f9e; }
  .badge-womens_savings     { background: #fde4f0; color: #a01764; }
  .badge-minor_savings      { background: #f1f8e0; color: #5c7a10; }
  /* Loan categories */
  .badge-housing_loan       { background: #e8e6fd; color: #3f2fb0; }
  .badge-personal_loan      { background: #e1f0ff; color: #1660b0; }
  .badge-education_loan     { background: #f2e6fd; color: #6a1fb0; }
  .badge-gold_loan          { background: #fff6da; color: #8a6a00; }
  .badge-lease              { background: #eef1f5; color: #3d4a5c; }
  .badge-pensioner_loan     { background: #fbe4e6; color: #9c1f2e; }
  @media (prefers-color-scheme: dark) {
    .badge-standard_fd        { background: #17335f; color: #a8c6ff; }
    .badge-senior_citizen_fd  { background: #4a331a; color: #ffcf9e; }
    .badge-special_fd         { background: #2c2867; color: #cac6ff; }
    .badge-sathkara_fd        { background: #5b1836; color: #ffb3cf; }
    .badge-digital_fd         { background: #103a26; color: #96f0c4; }
    .badge-standard_savings   { background: #0d3a3e; color: #7fe0eb; }
    .badge-senior_savings     { background: #4a3a0a; color: #ffd980; }
    .badge-teen_savings       { background: #123a5c; color: #8fcbff; }
    .badge-womens_savings     { background: #4a1030; color: #ff9ecb; }
    .badge-minor_savings      { background: #2e3a10; color: #c8e88a; }
    .badge-housing_loan       { background: #241a5c; color: #bcb2ff; }
    .badge-personal_loan      { background: #0f2e57; color: #9cc6ff; }
    .badge-education_loan     { background: #341a57; color: #d3aeff; }
    .badge-gold_loan          { background: #453400; color: #ffd76b; }
    .badge-lease              { background: #232a33; color: #c2cdd9; }
    .badge-pensioner_loan     { background: #4a1116; color: #ff9aa3; }
  }
  .empty, .error {
    padding: 2rem;
    text-align: center;
    color: var(--muted);
  }
  .error { color: #d24545; }
  .tabs {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }
  .tab-btn {
    font: inherit;
    font-weight: 600;
    font-size: 0.85rem;
    padding: 0.5rem 0.9rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    cursor: pointer;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  footer {
    max-width: 960px;
    margin: 1rem auto 2rem;
    padding: 0 1.5rem;
    font-size: 0.78rem;
    color: var(--muted);
  }
</style>
</head>
<body>

<header>
  <h1>SL Finance Compare</h1>
  <p>Fixed Deposit, Savings, and Loan rates across Sri Lankan banks</p>
</header>

<main>
  <div class="tabs" id="tabs"></div>

  <div class="toolbar">
    <label>
      Bank
      <select id="bankFilter">
        <option value="">All banks</option>
      </select>
    </label>
    <label>
      <span id="typeFilterLabel">Rate type</span>
      <select id="typeFilter">
        <option value="">All</option>
      </select>
    </label>
    <span class="status" id="status">Loading…</span>
  </div>

  <div class="table-wrap">
    <table id="ratesTable">
      <thead>
        <tr id="ratesHeadRow"></tr>
      </thead>
      <tbody id="ratesBody">
        <tr><td class="empty">Loading data…</td></tr>
      </tbody>
    </table>
  </div>
</main>

<footer id="footer"></footer>

<script>
(function () {
  // Each tab describes its own API endpoint, table columns, and which
  // column is the secondary filter (besides bank, which every tab has).
  // "rate" columns are right-aligned and shown as N.NN%; "tenure" columns
  // convert whole months to a "N year(s)/month(s)" label; "date" columns
  // are formatted with fmtDate; "badge" columns get the existing FD
  // rate_type pill styling; everything else renders as plain text.
  var TABS = [
    {
      id: "fd",
      label: "Fixed Deposits",
      apiUrl: "/api/v1/fixed-deposits",
      emptyMessage: "No fixed deposit rates in the database yet.",
      filterKey: "category_code",
      filterLabel: "Rate type",
      defaultSortKey: "interest_rate",
      columns: [
        { key: "bank_name", label: "Bank", type: "text" },
        { key: "tenure_value", label: "Tenure", type: "tenure" },
        { key: "category_code", label: "Type", type: "badge" },
        { key: "interest_rate", label: "Rate", type: "rate" },
        { key: "scraped_at", label: "Last updated", type: "date" }
      ]
    },
    {
      id: "savings",
      label: "Savings",
      apiUrl: "/api/v1/savings-rates",
      emptyMessage: "No savings rates in the database yet.",
      filterKey: "category_code",
      filterLabel: "Category",
      defaultSortKey: "interest_rate",
      columns: [
        { key: "bank_name", label: "Bank", type: "text" },
        { key: "category_code", label: "Category", type: "badge" },
        { key: "product_name", label: "Account", type: "text" },
        { key: "tenure_label", label: "Balance tier", type: "text" },
        { key: "interest_rate", label: "Rate", type: "rate" },
        { key: "scraped_at", label: "Last updated", type: "date" }
      ]
    },
    {
      id: "loans",
      label: "Loans",
      apiUrl: "/api/v1/loan-rates",
      emptyMessage: "No loan rates in the database yet.",
      filterKey: "category_code",
      filterLabel: "Category",
      defaultSortKey: "interest_rate",
      columns: [
        { key: "bank_name", label: "Bank", type: "text" },
        { key: "category_code", label: "Category", type: "badge" },
        { key: "product_name", label: "Product", type: "text" },
        { key: "tenure_label", label: "Tenure", type: "text" },
        { key: "rate_label", label: "Rate label", type: "text" },
        { key: "interest_rate", label: "Rate", type: "rate" },
        { key: "scraped_at", label: "Last updated", type: "date" }
      ]
    }
  ];

  var activeTab = TABS[0];
  var allRows = [];
  var sortKey = activeTab.defaultSortKey;
  var sortDir = -1; // -1 desc, 1 asc

  var tabsEl = document.getElementById("tabs");
  var statusEl = document.getElementById("status");
  var headRowEl = document.getElementById("ratesHeadRow");
  var bodyEl = document.getElementById("ratesBody");
  var footerEl = document.getElementById("footer");
  var bankFilterEl = document.getElementById("bankFilter");
  var typeFilterEl = document.getElementById("typeFilter");
  var typeFilterLabelEl = document.getElementById("typeFilterLabel");

  function fmtDate(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleString(undefined, {
      year: "numeric", month: "short", day: "numeric",
      hour: "2-digit", minute: "2-digit"
    });
  }

  function fmtTenure(months) {
    if (months % 12 === 0 && months >= 12) {
      var years = months / 12;
      return years + (years === 1 ? " year" : " years");
    }
    return months + (months === 1 ? " month" : " months");
  }

  function uniqueSorted(values) {
    var seen = {};
    var out = [];
    values.forEach(function (v) {
      if (v && !seen[v]) { seen[v] = true; out.push(v); }
    });
    out.sort();
    return out;
  }

  function escapeHtml(s) {
    var div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  function renderTabs() {
    tabsEl.innerHTML = "";
    TABS.forEach(function (tab) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "tab-btn" + (tab.id === activeTab.id ? " active" : "");
      btn.textContent = tab.label;
      btn.addEventListener("click", function () {
        if (tab.id === activeTab.id) return;
        switchTab(tab);
      });
      tabsEl.appendChild(btn);
    });
  }

  function renderHead() {
    headRowEl.innerHTML = activeTab.columns.map(function (col) {
      return '<th data-key="' + col.key + '">' + escapeHtml(col.label) + "</th>";
    }).join("");

    headRowEl.querySelectorAll("th[data-key]").forEach(function (th) {
      th.addEventListener("click", function () {
        var key = th.getAttribute("data-key");
        if (sortKey === key) {
          sortDir *= -1;
        } else {
          sortKey = key;
          sortDir = key === "interest_rate" ? -1 : 1;
        }
        updateSortIndicators();
        applyFiltersAndSort();
      });
    });
  }

  function populateFilters(rows) {
    bankFilterEl.innerHTML = '<option value="">All banks</option>';
    typeFilterLabelEl.textContent = activeTab.filterLabel;
    typeFilterEl.innerHTML = '<option value="">All</option>';

    var banks = uniqueSorted(rows.map(function (r) { return r.bank_name; }));
    var types = uniqueSorted(rows.map(function (r) { return r[activeTab.filterKey]; }));

    banks.forEach(function (b) {
      var opt = document.createElement("option");
      opt.value = b;
      opt.textContent = b;
      bankFilterEl.appendChild(opt);
    });
    types.forEach(function (t) {
      var opt = document.createElement("option");
      opt.value = t;
      opt.textContent = formatCategoryLabel(t);
      typeFilterEl.appendChild(opt);
    });
  }

  // Category codes are stored as e.g. "SENIOR_CITIZEN_FD" — display them
  // as "Senior Citizen Fd" rather than the raw underscored code. Filtering
  // still matches on the raw code (see applyFiltersAndSort).
  function formatCategoryLabel(code) {
    return String(code).toLowerCase().replace(/_/g, " ").replace(/\b\w/g, function (c) {
      return c.toUpperCase();
    });
  }

  function applyFiltersAndSort() {
    var bank = bankFilterEl.value;
    var type = typeFilterEl.value;
    var filterKey = activeTab.filterKey;

    var rows = allRows.filter(function (r) {
      return (!bank || r.bank_name === bank) && (!type || r[filterKey] === type);
    });

    rows.sort(function (a, b) {
      var av = a[sortKey], bv = b[sortKey];
      if (typeof av === "string") av = av.toLowerCase();
      if (typeof bv === "string") bv = bv.toLowerCase();
      if (av < bv) return -1 * sortDir;
      if (av > bv) return 1 * sortDir;
      return 0;
    });

    render(rows);
  }

  function renderCell(col, row) {
    var value = row[col.key];
    switch (col.type) {
      case "tenure":
        return '<td class="tenure">' + fmtTenure(value) + "</td>";
      case "rate":
        return '<td class="rate">' + value.toFixed(2) + "%</td>";
      case "date":
        return "<td>" + fmtDate(value) + "</td>";
      case "badge":
        return '<td><span class="badge badge-' + escapeHtml(String(value).toLowerCase()) + '">' +
          escapeHtml(formatCategoryLabel(value)) + "</span></td>";
      default:
        return "<td>" + escapeHtml(value) + "</td>";
    }
  }

  function render(rows) {
    var colCount = activeTab.columns.length;
    if (rows.length === 0) {
      bodyEl.innerHTML = '<tr><td colspan="' + colCount + '" class="empty">No rates match the current filters.</td></tr>';
      return;
    }

    bodyEl.innerHTML = rows.map(function (r) {
      return "<tr>" + activeTab.columns.map(function (col) { return renderCell(col, r); }).join("") + "</tr>";
    }).join("");
  }

  function updateSortIndicators() {
    headRowEl.querySelectorAll("th[data-key]").forEach(function (th) {
      th.classList.remove("sorted");
      th.removeAttribute("data-arrow");
      if (th.getAttribute("data-key") === sortKey) {
        th.classList.add("sorted");
        th.setAttribute("data-arrow", sortDir === 1 ? "▲" : "▼");
      }
    });
  }

  function renderFooter() {
    footerEl.innerHTML = "Data source: <code>" + activeTab.apiUrl + "</code>. Rates are as published by each " +
      "bank at last scrape time and may not reflect current promotional offers.";
  }

  function switchTab(tab) {
    activeTab = tab;
    sortKey = tab.defaultSortKey;
    sortDir = -1;
    renderTabs();
    renderHead();
    renderFooter();
    loadData();
  }

  bankFilterEl.addEventListener("change", applyFiltersAndSort);
  typeFilterEl.addEventListener("change", applyFiltersAndSort);

  function loadData() {
    allRows = [];
    statusEl.textContent = "Loading…";
    bodyEl.innerHTML = '<tr><td colspan="' + activeTab.columns.length + '" class="empty">Loading data…</td></tr>';

    fetch(activeTab.apiUrl)
      .then(function (res) {
        if (!res.ok) throw new Error("API returned status " + res.status);
        return res.json();
      })
      .then(function (payload) {
        allRows = payload.data || [];
        if (allRows.length === 0) {
          statusEl.textContent = "No data yet — run the scraper first.";
          bodyEl.innerHTML = '<tr><td colspan="' + activeTab.columns.length + '" class="empty">' +
            escapeHtml(activeTab.emptyMessage) + "</td></tr>";
          return;
        }
        populateFilters(allRows);
        updateSortIndicators();
        applyFiltersAndSort();
        statusEl.textContent = allRows.length + " rate" + (allRows.length === 1 ? "" : "s") + " loaded";
      })
      .catch(function (err) {
        statusEl.textContent = "";
        bodyEl.innerHTML = '<tr><td colspan="' + activeTab.columns.length + '" class="error">Failed to load data: ' +
          escapeHtml(err.message) + '. Is the API server running (go run ./cmd/api)?</td></tr>';
      });
  }

  renderTabs();
  renderHead();
  renderFooter();
  loadData();
})();
</script>

</body>
</html>
